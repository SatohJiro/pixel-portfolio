<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer gradient border frame -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#borderGrad)" />

  <!-- Inner dark card container -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" />

  <!-- Monogram NTA -->
  <text
    x="64"
    y="78"
    text-anchor="middle"
    fill="url(#textGrad)"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif"
    font-weight="900"
    font-size="44"
    letter-spacing="-1.5"
    filter="url(#neonGlow)"
  >NTA</text>

  <!-- Mini code badge dot indicator at top right -->
  <circle cx="102" cy="26" r="4.5" fill="#34d399" />
</svg>
